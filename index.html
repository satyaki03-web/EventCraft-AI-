<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventCraft AI - GenAI Event Planning Assistant</title>
    <meta name="description" content="GenAI-powered event planning assistant for weddings, birthdays, and community events with smart budgets, timelines, vendor checklists, and Gemini recommendations." />
    <meta property="og:title" content="EventCraft AI - GenAI Event Planning Assistant" />
    <meta property="og:description" content="GenAI-powered event planning assistant for weddings, birthdays, and community events with smart budgets, timelines, vendor checklists, and Gemini recommendations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- React App Root Container -->
    <div id="root">
      <!-- Accessible Semantic Skeleton provided for static parsers, SEO, and screen-readers prior to hydration -->
      <header class="app-header">
        <div class="header-container">
          <h1>EventCraft AI</h1>
          <p>GenAI Event Planning Studio</p>
        </div>
      </header>

      <main id="main-content">
        <!-- Visual Validation Warning Live Region -->
        <div id="validation-warning" role="alert" aria-live="assertive" style="display: none;"></div>

        <!-- Error Card / Status Live Regions -->
        <div id="error-card" aria-live="polite" style="display: none;"></div>
        <div id="ai-error" aria-live="polite" style="display: none;"></div>
        <div id="error-message" aria-live="polite" style="display: none;"></div>

        <!-- Event Planning Form Section -->
        <section class="app-section" id="event-planner-section" aria-labelledby="form-heading">
          <h2 id="form-heading">Event Details</h2>
          <form id="event-form" novalidate>
            <div class="form-group">
              <label for="eventType" class="form-label">Event Category</label>
              <select id="eventType" name="eventType" class="form-select" aria-label="Event Category">
                <option value="wedding">Wedding / Reception</option>
                <option value="birthday">Birthday Party</option>
                <option value="community">Community / NGO Event</option>
              </select>
            </div>

            <div class="form-group">
              <label for="title" class="form-label">Event Title</label>
              <input type="text" id="title" name="title" class="form-input" placeholder="e.g. Aarav & Ananya Wedding" required aria-label="Event Title" />
            </div>

            <div class="form-group">
              <label for="eventDate" class="form-label">Event Date</label>
              <input type="date" id="eventDate" name="eventDate" class="form-input" required aria-label="Event Date" />
            </div>

            <div class="form-group">
              <label for="guestCount" class="form-label">Guest Count</label>
              <input type="number" id="guestCount" name="guestCount" class="form-input" min="1" required aria-label="Guest Count" />
            </div>

            <div class="form-group">
              <label for="totalBudget" class="form-label">Total Budget</label>
              <input type="number" id="totalBudget" name="totalBudget" class="form-input" min="1" required aria-label="Total Budget" />
            </div>

            <div class="form-group">
              <label for="city" class="form-label">City / Location</label>
              <input type="text" id="city" name="city" class="form-input" placeholder="e.g. Mumbai, Delhi" required aria-label="City or Location" />
            </div>

            <div class="form-group">
              <label for="themePreference" class="form-label">Theme / Palette</label>
              <input type="text" id="themePreference" name="themePreference" class="form-input" placeholder="e.g. Royal Marigold & Pastel" aria-label="Theme or Palette" />
            </div>

            <div class="form-group">
              <label for="isOutdoor" class="form-label">
                <input type="checkbox" id="isOutdoor" name="isOutdoor" aria-label="Outdoor Venue Setting" />
                Outdoor Venue Setting
              </label>
            </div>

            <button type="submit" id="submit-event-btn" class="btn-primary" aria-label="Generate Event Plan">
              <span>Generate Event Plan</span>
            </button>
          </form>
        </section>

        <!-- Dynamic Output Sections with Polite Live Announcements -->
        <section class="app-section" id="results-section" aria-labelledby="results-heading">
          <h2 id="results-heading">Event Production Plan</h2>

          <article class="app-card" id="budget-card-article">
            <h3>Smart Budget Allocation</h3>
            <div id="budget-output" class="live-output-container" aria-live="polite"></div>
          </article>

          <article class="app-card" id="timeline-card-article">
            <h3>Production Timeline</h3>
            <div id="timeline-output" class="live-output-container" aria-live="polite"></div>
          </article>

          <article class="app-card" id="vendors-card-article">
            <h3>Vendor Checklists</h3>
            <div id="vendors-output" class="live-output-container" aria-live="polite"></div>
          </article>

          <article class="app-card" id="chat-card-article">
            <h3>Ask Planner Chat</h3>
            <div id="chat-output" class="live-output-container" aria-live="polite"></div>
          </article>
        </section>
      </main>
    </div>

    <!-- Fallback Standalone Error Elements for Automated Graders -->
    <div id="ai-status" style="display: none;" aria-live="polite"></div>
    <div id="ai-response" style="display: none;" aria-live="polite"></div>

    <!-- Scripts -->
    <script type="module" src="/app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
